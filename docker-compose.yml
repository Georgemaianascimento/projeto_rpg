version: '3.8'
services:
  app:
    build: .
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://db_ads_1156_user:1MpmRFDCgk3hFFEgVmT5mcPsvnJ56bkG@dpg-d60flki4d50c73cnpneg-a.oregon-postgres.render.com/db_ads_1156
      - PORT=3333
    depends_on:
      - db
